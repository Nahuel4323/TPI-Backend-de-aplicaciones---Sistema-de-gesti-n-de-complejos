# Cargar el .env de la carpeta desde la que se ejecuta el servicio.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=gateway

server.port=${SERVER_PORT:8080}

# Las rutas conservan el prefijo /api al reenviar la solicitud.
spring.cloud.gateway.server.webflux.routes[0].id=users
spring.cloud.gateway.server.webflux.routes[0].uri=${USERS_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users,/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=spaces
spring.cloud.gateway.server.webflux.routes[1].uri=${SPACES_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/spaces,/api/spaces/**

spring.cloud.gateway.server.webflux.routes[2].id=bookings
spring.cloud.gateway.server.webflux.routes[2].uri=${BOOKINGS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/bookings,/api/bookings/**

# Configuracion de Keycloak pendiente; Spring Security sigue activo.
