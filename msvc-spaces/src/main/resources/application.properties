# Cargar el .env de la carpeta desde la que se ejecuta el servicio.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=spaces

server.port=${SERVER_PORT:8082}

# Docker Compose crea la base; las credenciales se cargan desde el .env local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/spaces_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Desarrollo local: crear y actualizar tablas a partir de las entidades al iniciar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
