name: backend-complejos-deportivos

services:
  app-db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: ${APP_DB_ADMIN_PASSWORD:?Completar APP_DB_ADMIN_PASSWORD en el .env raiz}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?Completar USERS_DB_PASSWORD en el .env raiz}
      SPACES_DB_PASSWORD: ${SPACES_DB_PASSWORD:?Completar SPACES_DB_PASSWORD en el .env raiz}
      BOOKINGS_DB_PASSWORD: ${BOOKINGS_DB_PASSWORD:?Completar BOOKINGS_DB_PASSWORD en el .env raiz}
    ports:
      - "127.0.0.1:${APP_DB_PORT:-5433}:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app_admin -d postgres && psql -U app_admin -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = 'bookings_db'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Completar KEYCLOAK_DB_PASSWORD en el .env raiz}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Completar KEYCLOAK_DB_PASSWORD en el .env raiz}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Completar KEYCLOAK_ADMIN_PASSWORD en el .env raiz}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-db-data:
  keycloak-db-data:
